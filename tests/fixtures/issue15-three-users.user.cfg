# Three active users, one disabled user, no Administrator ACLs and no root tokens.
# Current Proxmox VE keeps second factors outside user.cfg, so nothing here says who has 2FA.

user:alice@pve:1:0:Alice:Admin:alice@example.com:Cluster admin::
user:bob@pve:1:0:Bob:Ops:bob@example.com:Operations::
user:carol@pve:1:0:Carol:Dev:carol@example.com:Developer::
user:olduser@pve:0:0:Old:User:old@example.com:Disabled account::

group:ops:alice@pve,bob@pve:Operations:

acl:1:/vms:@ops:PVEVMAdmin:
acl:1:/vms:carol@pve:PVEVMUser:
